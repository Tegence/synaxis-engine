name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - name: Check dependencies and the standard library for known vulnerabilities
        run: |
          python3 -B -m unittest discover -s scripts -p '*_test.py'
          python3 -B scripts/check_go_vulnerabilities.py
      - run: go test -race ./internal/engine/
      - run: go test ./...
